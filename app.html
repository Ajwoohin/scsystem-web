<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCsystem Dashboard</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('scsystem-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app-shell">
  <header class="app-header">
    <span class="brand-sm"><span>SC</span>system</span>
    <span id="roleBadge" class="badge blue"></span>
    <span class="grow"></span>
    <a class="btn btn-primary btn-sm app-download-link" href="https://drive.google.com/file/d/1fmXFM14uVsfaNU1xBrbjF3dn-gA6gwaT/view?usp=sharing" target="_blank" rel="noopener noreferrer">Download app now!</a>
    <span id="userName" class="user-chip"></span>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
    <button id="logoutBtn" class="btn btn-secondary btn-sm" type="button">Log Out</button>
  </header>

  <div class="app-body">
    <nav id="nav" class="sidebar" aria-label="Main menu"></nav>
    <main id="view" class="content"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/dashboard-entry.js"></script>
</body>
</html>
